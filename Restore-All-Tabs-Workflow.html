<title>Quickserve ERP — D365 Finance & Operations — V2.1.65</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1230;color:#e8ecff;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:16px}h1{font-size:26px;margin:6px 0}h1 b{color:#3ddc84}.sub{color:#aab3d6;font-size:13px}
.banner{background:#0d5a2e;border:1px solid #2ecc71;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;margin:12px 0}
.groups{display:flex;flex-wrap:wrap;gap:8px}.grp{background:#14204d;border:1px solid #2a3a7a;border-radius:20px;padding:8px 14px;font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.tab{border:1px solid #2a3a7a;background:#14204d;color:#fff;border-radius:20px;padding:9px 14px;cursor:pointer}.tab.active{background:#2563eb}
.card{background:#101a42;border:1px solid #2a3a7a;border-radius:12px;padding:14px;margin:12px 0}
h2{margin:0 0 6px;font-size:19px}h3{margin:14px 0 6px;font-size:16px}.muted{color:#aab3d6;font-size:12.5px;line-height:1.6}
label{font-size:12px;color:#aab3d6;display:block;margin:8px 0 3px}input,select,textarea{width:100%;background:#0a1230;color:#fff;border:1px solid #2a3a7a;border-radius:8px;padding:8px}
textarea{min-height:52px}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:9px 13px;cursor:pointer;margin:6px 6px 0 0}button.ghost{background:#1c2a5e}button.danger{background:#b91c1c}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}th,td{border-bottom:1px solid #2a3a7a;padding:7px;text-align:left;vertical-align:top}th{color:#aab3d6}
.pill{display:inline-block;background:#1c2a5e;border-radius:12px;padding:3px 9px;font-size:11px;margin-right:6px}.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat div{background:#0a1230;border:1px solid #2a3a7a;border-radius:10px;padding:12px}.stat b{font-size:20px}
.lock{background:#3a2a00;border:1px solid #d4a017;border-radius:10px;padding:12px;font-size:13px}.small{font-size:12px}
@media(max-width:800px){.row,.row3,.stat{grid-template-columns:1fr 1fr}}
#perm input,#perm select,#perm textarea,#perm button{pointer-events:none !important}
#perm #permAddBox input,#perm #permAddBox select,#perm #permAddBox button{pointer-events:auto !important}
#perm input[type="checkbox"]{opacity:1}
.panel{display:none}.panel.active{display:block}
#pscope input,#pscope select,#pscope textarea,#pscope button{pointer-events:none !important}
#perm input,#perm select,#perm textarea,#perm button{pointer-events:none !important}
#pscope input[type="checkbox"],#perm input[type="checkbox"]{opacity:1}
.box{background:#12203f;border:1px solid #233a67;border-radius:14px;padding:16px;flex:1;min-width:300px;margin:14px 0}
.btn{display:inline-block;background:#2563eb;color:#fff;border-radius:999px;padding:10px 16px;cursor:pointer;margin:8px 2px}

<!-- ================= PARAMETER & COA ================= -->
<div class="panel" id="pcoa">
<div class="card"><h2>Parameter &amp; COA Mapping</h2><p class="muted">Map parameters and chart of accounts to the D365 target. Exact fields vary by release, enabled feature, country/region, ISV and custom code.</p>
<div class="stat"><div><b>Steps 0–28</b><br><span class="muted">29 steps</span></div><div><b id="paramTotal">812</b><br><span class="muted">Parameters</span></div><div><b id="coaTotal">Standard 12 / Customer 5 / Both 17 (sample)</b><br><span class="muted">COA rows</span></div><div><b>Scope</b><br><span class="muted">Only modules ticked In Scope in Project &amp; Scope are shown</span></div></div></div>
<div style="margin-top:12px"><button class="tab active" id="pcoaParamBtn" onclick="showPCOA('param',this)">Parameters</button><button class="tab" id="pcoaCoaBtn" onclick="showPCOA('coa',this)">COA Mapping</button><span class="muted"> &nbsp;Parameters and COA are separate views — no need to scroll past all 812 parameters to reach COA.</span></div>

<div class="card" id="intCard"><h2>Integration Details — once per table / flow, not per line</h2>
<p class="muted"><b>Yes — this is the place we give the integration details.</b> Integration details are entered once per table / flow. Do not repeat them on every parameter line. Each parameter / COA row has an <b>Integration</b> button that brings you here and pre-fills the D365 Entity / Table for that row.</p>
<div class="row"><div><label>External System</label><input id="intExt" placeholder="Legacy ERP / Bank / CRM"></div>
<div><label>D365 Entity / Table</label><input id="intEnt" placeholder="CustTable / VendTable / MainAccount"></div>
<div><label>Direction</label><select id="intDir"><option>Inbound to D365</option><option>Outbound from D365</option><option>Both</option></select></div>
<div><label>Pattern</label><select id="intPat"><option>Data entity</option><option>OData</option><option>Batch</option><option>Dual-write</option><option>Manual</option></select></div></div>
<div class="row"><div><label>Frequency</label><select id="intFreq"><option>Real-time</option><option>Daily</option><option>Weekly</option><option>Monthly</option><option>On-demand</option></select></div>
<div><label>SLA</label><input id="intSLA" placeholder="e.g. Daily by 9 AM"></div>
<div><label>Owner</label><input id="intOwner" placeholder="Owner person, not team"></div>
<div><label>Status</label><select id="intStatus"><option>To confirm</option><option>Confirmed</option><option>Ready to Build</option><option>Blocked</option></select></div></div>
<label>Notes</label><textarea id="intNotes" placeholder="Entity name, fields verified, pattern, test status…"></textarea>
<button onclick="saveInt()">Save Integration Details</button><button class="ghost" onclick="clearInt()">Clear</button>
<p class="muted" id="intSaved"><b>Saved Integration Details:</b> Not saved yet.</p></div>

<div id="paramCard"><div class="card"><h2>Parameter Details — Line by Line, Modulewise</h2>
<p class="muted">Parameters are grouped modulewise. Use Module / Step / Search to filter. Value is editable per line.</p>
<div class="row3"><div><label>Module filter</label><select id="pMod" onchange="renderParams()"></select></div>
<div><label>Step filter</label><select id="pStep" onchange="renderParams()"></select></div>
<div><label>Search parameter / D365 field</label><input id="pSearch" placeholder="Search…" oninput="renderParams()"></div></div>
<button onclick="toggleAddParam()">+ Add Parameter</button><button class="danger" onclick="deleteSelectedParams()">Delete Selected</button>
<span class="muted" id="paramCount"></span>
<div id="addParamForm" style="display:none;border:1px solid #2a3a7a;border-radius:10px;padding:12px;margin-top:10px">
<h3>Add Parameter (in-page only)</h3>
<div class="row"><div><label>Module</label><select id="apMod"></select></div><div><label>Step</label><select id="apStep"></select></div>
<div><label>Parameter</label><input id="apName" placeholder="Parameter name"></div><div><label>D365 Field / Table</label><input id="apField" placeholder="D365 field / table"></div></div>
<div class="row"><div><label>Value</label><input id="apVal"></div><div><label>Status</label><select id="apStatus"><option>Not started</option><option>In progress</option><option>Done</option><option>Blocked</option><option>Not applicable</option></select></div></div>
<button onclick="saveParam()">Save Parameter</button><button class="ghost" onclick="toggleAddParam()">Cancel</button></div>
<div id="paramSections"></div></div></div>

<div id="coaWrap" style="display:none"><div class="card"><h2>COA Mapping — Standard + Customer</h2>
<p class="muted"><b>Demo:</b> select Standard COA. <b>Customer:</b> select Customer COA. Mapping follows the selected type.</p>
<div class="row"><div><label>COA Type to map</label><select id="coaType" onchange="renderCOA()"><option>Both</option><option>Standard COA</option><option>Customer COA</option></select></div><div><label>Module filter — COA</label><select id="coaMod" onchange="renderCOA()"></select></div><div><label>Mapping Status</label><select id="coaStatFilter" onchange="renderCOA()"><option>All statuses</option><option>Not mapped</option><option>Mapped</option><option>Verified</option><option>Blocked</option></select></div><div><label>Search Account / Account Name / D365 Main Account</label><input id="coaSearch" placeholder="Search…" oninput="renderCOA()"></div></div>
<div style="margin-top:10px"><button onclick="toggleAddCOA()">+ Add COA</button><button class="danger" onclick="deleteSelectedCOA()">Delete Selected COA</button><span class="muted" id="coaCount"></span></div>
<div id="addCOAForm" style="display:none;border:1px solid #2a3a7a;border-radius:10px;padding:12px;margin-top:10px">
<h3>Add COA (in-page only)</h3><div class="row"><div><label>COA Type</label><select id="acType"><option>Standard COA</option><option>Customer COA</option></select></div>
<div><label>Module</label><select id="acMod"></select></div><div><label>Account</label><input id="acAcc"></div><div><label>Account Name</label><input id="acName"></div></div>
<div class="row"><div><label>Type</label><select id="acKind"><option>Asset</option><option>Liability</option><option>Equity</option><option>Revenue</option><option>Expense</option></select></div>
<div><label>Category</label><input id="acCat"></div><div><label>D365 Main Account</label><input id="acD365"></div>
<div><label>Mapping Status</label><select id="acStat"><option>Not mapped</option><option>Mapped</option><option>Verified</option><option>Blocked</option></select></div></div>
<button onclick="saveCOA()">Save COA</button><button class="ghost" onclick="toggleAddCOA()">Cancel</button></div>
<div style="overflow-x:auto"><table><thead><tr><th>Select</th><th>COA Type</th><th>Module</th><th>Account</th><th>Account Name</th><th>Type</th><th>Category</th><th>D365 Main Account</th><th>Mapping Status</th><th>Integration</th><th>Actions</th></tr></thead><tbody id="coaBody"></tbody></table></div></div>

<div class="card"><h2>Upload COA — Standard / Customer</h2>
<div class="row3"><div><label>COA Type to upload</label><select id="upType"><option>Standard COA</option><option>Customer COA</option></select></div>
<div><label>Choose CSV file</label><input type="file" id="coaFile" accept=".csv"></div>
<div><label>&nbsp;</label><button onclick="uploadCOA()">Upload &amp; Preview (in-page only)</button></div></div>
<p class="muted">CSV header: Account,Account Name,Type,Category,D365 Main Account &nbsp;|&nbsp; <button class="ghost" onclick="downloadCOATemplate()">Download COA template (CSV)</button></p>
<div id="coaPreview"></div></div></div>
</div>

<!-- ================= QUESTIONNAIRE ================= -->
<div class="panel" id="quest" style="display:none">
<div class="card"><h2>Questionnaire</h2><p class="muted">Questions filter by Vertical + Module + Area + Section + Search. Area shows only the functionalities of the selected Module. Section values follow the selected Area.</p>
<div class="row"><div><label>Vertical</label><select id="qVert" onchange="renderQ()"></select></div>
<div><label>Module (All D365 F&amp;O)</label><select id="qMod" onchange="onQMod()"></select></div>
<div><label>Area — only for selected Module</label><select id="qArea" onchange="onQArea()"></select></div>
<div><label>Section — follows Area</label><select id="qSec" onchange="renderQ()"></select></div></div>
<div class="row"><div><label>Search questions</label><input id="qSearch" placeholder="Search…" oninput="renderQ()"></div>
<div><label>&nbsp;</label><span class="muted" id="qCount"></span></div></div>
<button onclick="toggleAddQ()">+ Add Question</button><button class="danger" onclick="deleteSelectedQ()">Delete Selected</button></div>

<div class="card" id="addQForm" style="display:none"><h3>Add / Modify Question (in-page only)</h3>
<div class="row"><div><label>Vertical</label><select id="aqVert"></select></div><div><label>Module</label><select id="aqMod" onchange="fillArea('aqMod','aqArea','aqSec')"></select></div>
<div><label>Area</label><select id="aqArea" onchange="fillSection('aqMod','aqArea','aqSec')"></select></div><div><label>Section</label><select id="aqSec"></select></div></div>
<div class="row"><div><label>Question (max 75 chars) <span id="qChar">0 / 75</span></label><textarea id="aqQ" maxlength="75" oninput="document.getElementById('qChar').textContent=this.value.length+' / 75'"></textarea></div>
<div><label>Clarification (max 100 chars) <span id="cChar">0 / 100</span></label><textarea id="aqClar" maxlength="100" oninput="document.getElementById('cChar').textContent=this.value.length+' / 100'"></textarea></div>
<div><label>Type</label><select id="aqType"><option>Setup</option><option>Information</option></select></div>
<div><label>Answer</label><select id="aqAns"><option>Terms</option><option>Groups</option><option>Text</option><option>Yes-No</option><option>Date</option><option>Number</option></select></div></div>
<button onclick="saveQ()">Save Question</button><button class="ghost" onclick="toggleAddQ()">Cancel</button></div>

<div class="card"><h3>Export / Import — Modulewise</h3>
<div class="row3"><div><label>Module to export / import</label><select id="expMod"></select></div>
<div><label>&nbsp;</label><button onclick="exportQ(false)">Export questions for selected module (CSV)</button><button onclick="exportQ(true)">Export ALL questions (CSV)</button></div>
<div><label>Choose CSV file</label><input type="file" id="qFile" accept=".csv"><button onclick="importQ()">Import &amp; Preview (in-page only)</button></div></div>
<p class="muted">CSV header: Question ID,Vertical,Module,Area,Section,Question,Clarification,Type,Answer</p><div id="qPreview"></div></div>

<div class="card"><div style="overflow-x:auto"><table><thead><tr><th>Select</th><th>Question ID</th><th>Vertical</th><th>Module</th><th>Area</th><th>Section</th><th>Question</th><th>Clarification</th><th>Type</th><th>Answer</th><th>Actions</th></tr></thead><tbody id="qBody"></tbody></table></div>
<p class="muted" id="qEmpty" style="display:none">No questions match this selection. Change Module / Area / Section or add a new question.</p></div>
</div>


<div class="panel" id="cfg" style="display:none"><div id="panel-setup-masters-config"><h2>Setup Masters - Config Builder — Separate Tab</h2><p class="muted">Separate tab — Questionnaire and Setup &amp; Configuration tabs are untouched. Test here first. Later, if you want, we can disable others. <b>Line-by-line, never comma / colon separated.</b> One line = one record in D365. Customer marks per line: Required / Not Required, and per question: This question Required / Not Required. Mapping is ONCE per table, not per line. Integration details only if data comes from another system.</p>
<div class="box"><h3>Filters — Module-wise and Vertical-wise</h3><div class="row"><label>Vertical<select id="smbVertical" onchange="smbRender()"><option>All Verticals</option><option>Discrete manufacturing</option><option>Process Manufacturing (Food)</option><option>Agriculture &amp; Agribusiness</option><option>Retail and Commerce</option><option>Project-based / Services</option></select></label><label>Module<select id="smbModule" onchange="smbRender()"></select></label><label>Section<select id="smbSection" onchange="smbRender()"><option value="all">All Sections — Setup Masters + Configurations + Parameters</option><option value="masters">Setup Masters only</option><option value="config">Configurations only</option><option value="params">Parameters only</option></select></label><label>Question Status<select id="smbQStatus" onchange="smbRender()"><option>Required — This question is Required</option><option>Not Required — Skip this whole question</option></select></label></div><div class="row"><label>View As — Permission Role<select id="smbRole" onchange="smbApplyRole()"><option>Consultant — Sees All</option><option>Backend — Sees Mapping + Integration, No Delete</option><option>Customer — Sees Values Only, No Integration, No Delete</option></select></label><div class="row"><label>Signed in as — Full Access check<select id="smbUser" onchange="smbApplyRole()"><option>experiencepavilion25@gmail.com — Full Access, Can Delete for Testing</option><option>naniiyengar@gmail.com — Full Access, Can Delete for Testing</option><option>Consultant — Full Access</option><option>Customer Guest — Values Only, No Delete</option></select></label><span class="muted">Verified from Permission: both emails above have Full Access. Customer Guest has Values Only.</span></div><div class="box"><h3>Permission — Full Access Verification</h3><table><thead><tr><th>User / Email</th><th>Access</th><th>Sees Mapping + Integration</th><th>Sees Delete</th><th>Can Add Question / Line</th></tr></thead><tbody><tr><td><b>experiencepavilion25@gmail.com</b></td><td><b>Full Access</b></td><td>Yes</td><td><b>Yes — For Testing</b></td><td>Yes</td></tr><tr><td><b>naniiyengar@gmail.com</b></td><td><b>Full Access</b></td><td>Yes</td><td><b>Yes — For Testing</b></td><td>Yes</td></tr><tr><td>Consultant</td><td>Full Access</td><td>Yes</td><td>Yes — For Testing</td><td>Yes</td></tr><tr><td>Backend</td><td>Full Access</td><td>Yes</td><td>Yes — For Testing</td><td>Yes</td></tr><tr><td>Customer Guest</td><td>Values Only</td><td>No — Hidden</td><td>No — Hidden</td><td>Yes — Title / Lines only, Mark Not Required</td></tr></tbody></table><p class="muted">To test Delete: pick one of the two Full Access emails above + Role = Consultant. To test Customer view: pick Customer Guest + Role = Customer — Delete must disappear.</p></div><span class="muted">Customer never sees Integration details. Integration is a separate section, hidden field-wise by Role.</span></div><p class="muted" id="smbHint"></p></div>
<div class="box"><h3>Permission Matrix — Who sees what?</h3><table><thead><tr><th>Role</th><th>Values — Code / Description / Days</th><th>Mapping — Table / Field, ONCE per table</th><th>Integration Details — Separate Section</th><th>Add New Line</th><th>Mark Not Required</th><th>Delete Line</th></tr></thead><tbody><tr><td><b>Customer</b></td><td>Yes — Edit values</td><td>No — Hidden</td><td>No — Hidden</td><td>Yes — Per-table + Add Line</td><td>Yes — Status = Not Required</td><td>No — Never, Delete removed</td></tr><tr><td><b>Backend</b></td><td>Yes — View</td><td>Yes — View / Edit</td><td>Yes — View / Edit</td><td>Yes</td><td>Yes</td><td>No — Never</td></tr><tr><td><b>Consultant</b></td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td><td>No — Use Not Required, never Delete, so audit trail stays</td></tr></tbody></table><p class="muted">How it works: Integration is a <b>separate section</b> under each table (class: Integration Details), AND it is hidden <b>field-wise by Role</b> — when Role = Customer, every Integration section + every Mapping section is hidden in this tab. Customer sees only Values + Status. No Delete button exists anywhere in this tab for any role.</p></div>
<div class="row"><button onclick="smbDownloadTemplate()">Download Template — Current Module (CSV)</button><button class="ghost" onclick="smbDownloadEntire()">Download Template — Entire Questionnaire, All Modules (CSV)</button><button class="ghost" onclick="smbDownloadIntegrationTemplate()">Download Integration Template (CSV) — With Integration Details</button></div><div class="row"><label>Upload CSV — Entire or Module-wise (Preview + Import)<input type="file" id="smbFile" accept=".csv" onchange="smbUpload(this)"></label><span class="muted">Upload accepts Entire file or Single-Module file — first column tells which Module it belongs to. Preview first, then Import adds rows to that Module.</span></div><p class="muted" id="smbMsg">Choose Module + Section above. AP example is fully filled. Other modules show the same structure with starter lines — edit them, add lines, mark Not Required.</p>
<div id="smbContent"></div>
<div class="box"><h3>How to use — for Customer and Backend</h3><p><b>Customer:</b> Fill Code / Description / Days etc. line by line. Mark each line Required / Not Required. Add new lines at bottom. If whole question not needed, set Question Status = Not Required. Never type Table Name / Field Name — consultant fills mapping once below.</p><p><b>Consultant / Backend:</b> Mapping is ONCE per table (below the values table). Integration columns only if “Is this Integration? = Yes”. If No, leave integration blank. Do NOT fill integration per line.</p><p class="muted"><b>NOT LIVE</b> — Add / Upload here is Preview only, not saved to D365. To create in D365: Confirm INT flow in Integration + Final Gate 8/8 + TEST-COMPANY-01, 3–5 rows max. Client Secret NEVER here.</p></div></div></div> <div class="card muted">Quickserve ERP V2.1.59 &nbsp;|&nbsp; Admin: experiencepavilion25@gmail.com &nbsp;|&nbsp; SQL: checking... &nbsp;|&nbsp; Demo Customer — Quickserve ERP &nbsp;|&nbsp; + New project &nbsp;|&nbsp; Logout &nbsp;|&nbsp; In-page only — no live D365, no Client Secret, no direct SQL writes.</div>

<div class="panel" id="bp" style="display:none"><div class="card"><h2>Business Process</h2><p class="muted">Enter Business Process Name, As-Is process and To-Be process. Flow is generated from the steps you enter — one step per line. Vertical-wise, Module-wise, Functionality-wise.</p><div class="row"><div><label>Vertical filter</label><select id="bpVertF" onchange="renderBP()"></select></div><div><label>Module filter</label><select id="bpModF" onchange="onBPModF()"></select></div><div><label>Functionality filter</label><select id="bpAreaF" onchange="renderBP()"></select><select id="bpSecDummyF" style="display:none"><option>All sections</option></select></div><div><label>Search</label><input id="bpSearch" placeholder="Search process name…" oninput="renderBP()"></div></div><p class="muted" id="bpCount"></p><button onclick="toggleAddBP()">+ Add Business Process</button><button class="danger" onclick="deleteSelectedBP()">Delete Selected</button></div><div class="card" id="addBPForm" style="display:none"><h3>Add / Modify Business Process (in-page only)</h3><div class="row"><div><label>Vertical</label><select id="bpVert"></select></div><div><label>Module</label><select id="bpMod" onchange="fillArea('bpMod','bpArea','bpSecDummy')"></select></div><div><label>Functionality (Area)</label><select id="bpArea"></select><select id="bpSecDummy" style="display:none"><option>All sections</option></select></div><div><label>Business Process Name</label><input id="bpName" placeholder="e.g. Vendor Onboarding — AP"></div></div><div class="row"><div><label>Owner</label><input id="bpOwner" placeholder="Owner person, not team"></div><div><label>Status</label><select id="bpStatus"><option>As-Is captured</option><option>To-Be designed</option><option>Approved</option><option>In UAT</option><option>Live</option></select></div></div><div class="row"><div><label>As-Is Process — one step per line</label><textarea id="bpAsIs" style="min-height:90px"></textarea></div><div><label>To-Be Process — one <script>
/* ===== Project & Scope — Module Details — V2.1.65 additive only, namespaced PSCOPE_ ===== */
var PSCOPE_MODULES = ["Organization administration", "System administration & security", "General ledger", "Cash and bank management", "Tax", "Accounts payable", "Accounts receivable", "Credit and collections", "Fixed assets", "Budgeting", "Cost accounting", "Product information management", "Inventory management", "Procurement and sourcing", "Sales and marketing", "Warehouse management", "Transportation management", "Master planning", "Production control", "Engineering change management", "Quality management", "Asset management", "Project management and accounting", "Human resources", "Payroll / external payroll", "Retail and Commerce", "Expense management", "Subscription billing / recurring revenue", "Intercompany", "Compliance, reporting & localization", "Integration, data migration & analytics"];
var PSCOPE_CUR = 0;
var PSCOPE_DATA = {}; // {moduleName: {ticked, detail, out, processes, owner, status, notes}}
function PSCOPE_load(){try{var raw=localStorage.getItem("qs_pscope_v2165");if(raw){var d=JSON.parse(raw);if(d)PSCOPE_DATA=d;}}catch(e){} PSCOPE_MODULES.forEach(function(m){if(!PSCOPE_DATA[m])PSCOPE_DATA[m]={ticked:true,detail:"",out:"",processes:"",owner:"",status:"In Scope",notes:""};});}
function PSCOPE_save(silent){try{localStorage.setItem("qs_pscope_v2165",JSON.stringify(PSCOPE_DATA));}catch(e){} var m=document.getElementById("pscopeMsg");if(m&&!silent)m.textContent="Project & Scope auto-saved in this browser.";}
function PSCOPE_esc(s){s=String(s==null?"":s);return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\\"/g,"&quot;");}
function PSCOPE_count(){var c=document.getElementById("pscopeCount");if(c){var n=PSCOPE_MODULES.filter(function(m){return PSCOPE_DATA[m]&&PSCOPE_DATA[m].ticked;}).length;c.textContent=n+" / 31 modules ticked (In Scope). Click Details on any module to give its scope details.";}}
function renderScopeModules(){PSCOPE_load();var c=document.getElementById("pscopeModules");if(!c)return;var q=(document.getElementById("pscopeSearch")?document.getElementById("pscopeSearch").value:"").toLowerCase();c.innerHTML="";PSCOPE_MODULES.forEach(function(m,idx){if(q&&m.toLowerCase().indexOf(q)<0)return;var d=PSCOPE_DATA[m];var div=document.createElement("div");div.style.cssText="border:1px solid #2a3a7a;border-radius:8px;padding:8px;background:#0a1230";div.innerHTML='<label><input type="checkbox" '+(d.ticked?"checked":"")+' onchange="PSCOPE_toggle('+idx+',this.checked)"> '+PSCOPE_esc(m)+'</label><br><span class="muted">'+PSCOPE_esc(d.status||"")+(d.detail?" — "+PSCOPE_esc(d.detail.slice(0,60)):"")+'</span><br><button class="ghost" onclick="PSCOPE_show('+idx+')">Details</button>';c.appendChild(div);});PSCOPE_count();}
function PSCOPE_toggle(idx,checked){var m=PSCOPE_MODULES[idx];PSCOPE_DATA[m].ticked=checked;if(checked&&PSCOPE_DATA[m].status==="Out of Scope")PSCOPE_DATA[m].status="In Scope";if(!checked)PSCOPE_DATA[m].status="Out of Scope";PSCOPE_save(true);renderScopeModules();PSCOPE_show(idx);}
function scopeAll(on){PSCOPE_MODULES.forEach(function(m){PSCOPE_DATA[m].ticked=!!on;PSCOPE_DATA[m].status=on?"In Scope":"Out of Scope";});PSCOPE_save(true);renderScopeModules();}
function PSCOPE_show(idx){PSCOPE_CUR=idx;var m=PSCOPE_MODULES[idx];var d=PSCOPE_DATA[m];var el=document.getElementById("pscopeDetail");if(!el)return;el.innerHTML='<div class="card"><h3>Module Details — '+PSCOPE_esc(m)+'</h3><p class="muted">Give the scope details for this module only. Click Details on another module to switch. Edit any field, Tab out — it auto-saves (like D365). This detail is per module, not per row.</p><div class="row"><div><label>In Scope?</label><select data-psf="status" onchange="PSCOPE_field(this)" onblur="PSCOPE_field(this)"><option>In Scope</option><option>Out of Scope</option><option>To confirm</option><option>Phase 2</option></select></div><div><label>Owner (person, not team)</label><input data-psf="owner" value="'+PSCOPE_esc(d.owner)+'" placeholder="e.g. [Enter owner name]" onchange="PSCOPE_field(this)" onblur="PSCOPE_field(this)"></div></div><div><label>What is IN Scope for this module? (processes / masters / transactions)</label><textarea data-psf="detail" rows="2" placeholder="e.g. Vendor master, PO, GRN, Invoice, Payment — for Accounts payable" onchange="PSCOPE_field(this)" onblur="PSCOPE_field(this)">'+PSCOPE_esc(d.detail)+'</textarea></div><div><label>What is OUT of Scope for this module?</label><textarea data-psf="out" rows="2" placeholder="e.g. No intercompany, no subcontracting in Phase 1" onchange="PSCOPE_field(this)" onblur="PSCOPE_field(this)">'+PSCOPE_esc(d.out)+'</textarea></div><div><label>Key Processes / Functionalities</label><textarea data-psf="processes" rows="2" placeholder="e.g. PO approval, 3-way match, Vendor payment journal" onchange="PSCOPE_field(this)" onblur="PSCOPE_field(this)">'+PSCOPE_esc(d.processes)+'</textarea></div><div><label>Notes / Assumptions / Dependencies</label><textarea data-psf="notes" rows="2" placeholder="e.g. Depends on: Legal Entity (Organization administration). Needs: Bank masters." onchange="PSCOPE_field(this)" onblur="PSCOPE_field(this)">'+PSCOPE_esc(d.notes)+'</textarea></div><p class="muted">Module: '+PSCOPE_esc(m)+' &nbsp;|&nbsp; Tick in the grid above = In Scope. Untick = Out of Scope.</p></div>';var sel=el.querySelector('select[data-psf="status"]');if(sel)sel.value=d.status||"In Scope";}
function PSCOPE_field(el){var m=PSCOPE_MODULES[PSCOPE_CUR];var f=el.getAttribute("data-psf");PSCOPE_DATA[m][f]=el.value;if(f==="status")PSCOPE_DATA[m].ticked=(el.value==="In Scope"||el.value==="To confirm"||el.value==="Phase 2");PSCOPE_save();renderScopeModules();PSCOPE_show(PSCOPE_CUR);}
PSCOPE_load();renderScopeModules();
<\/script>

/select></div></div><div id="checkTable" style="overflow-x:auto;margin-top:10px"></div></div><div class="card"><h3>⚠ Message — Masters</h3><p class="muted"><b>Do not integrate any transaction until its masters are confirmed.</b> Sales orders need Customers + Items. Purchase orders need Vendors + Items. Inventory journals need Items + Warehouses. Production orders need Items + BOM. If a master is wrong, every transaction built on it is wrong. Masters first, transactions second — no exceptions.</p></div><div class="card"><h3>⚠ Message — Parameters</h3><p class="muted"><b>Parameters must be set before the module is integrated.</b> 812 parameters, Steps 0–28, per legal entity. If a parameter is wrong, the integration will post wrongly even though the field mapping is right. Check in Parameter &amp; COA Mapping: module → parameter → value → status. No parameter = no integration for that module.</p></div><div class="card"><h3>⚠ Message — COA Mappings</h3><p class="muted"><b>COA must be mapped before any GL posting.</b> Standard 12 / Customer 5 / Both 17 (sample). Every journal, invoice, payment, and bank statement posts to a MainAccount. If the COA is not mapped, the journal fails or posts to the wrong account. COA first, then INT-07 (GL Journal), then INT-08 / INT-09 (invoices / payments), then INT-10 (bank statements).</p></div><div class="card"><h3>How to use this checklist</h3><ol class="muted"><li>Work top to bottom — Phase 0 first, then Phase 1, then Phase 2, then Phase 3.</li><li>For each row: customer confirms module + functionality + fields + owner (a person, not a team) → set status to <b>Ready to Build</b>.</li><li>Build only Ready to Build rows. Test each one in TEST-COMPANY-01, 3–5 rows max.</li><li>When all 8 Final Gate checks pass (see Pilot Pipeline), set status to <b>Done</b>.</li><li>Client Secret NEVER in this file. No live D365. No direct SQL.</li></ol></div></div><div class="panel" id="intmap" style="display:none"><div class="card"><h2>Integration Map let pilotSelected=null;
function fillPilotFuncs(){
  const mod=document.getElementById('pilotMod').value;
  const sel=document.getElementById('pilotFunc');
  const funcs=PILOT.filter(function(r){return mod==='All modules'||r.mod===mod}).map(function(r){return r.func});
  const uniq=[]; funcs.forEach(function(f){if(uniq.indexOf(f)<0)uniq.push(f)});
  sel.innerHTML='<option>All functionalities</option>'+uniq.map(function(f){return '<option>'+f+'</option>'}).join('');
  renderPilot();
}
function renderPilot(){
  const mod=document.getElementById('pilotMod').value;
  const func=document.getElementById('pilotFunc').value;
  const rows=PILOT.filter(function(r){return (mod==='All modules'||r.mod===mod)&&(func==='All functionalities'||r.func===func)});
  let h='<table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th style="text-align:left;border-bottom:1px solid #2a3a7a;padding:6px">ID</th><th style="text-align:left;border-bottom:1px solid #2a3a7a;padding:6px">Module</th><th style="text-align:left;border-bottom:1px solid #2a3a7a;padding:6px">Functionality to be integrated</th><th style="text-align:left;border-bottom:1px solid #2a3a7a;padding:6px">D365 data entity</th><th style="text-align:left;border-bottom:1px solid #2a3a7a;padding:6px">Direction</th><th style="text-align:left;border-bottom:1px solid #2a3a7a;padding:6px">Frequency</th><th style="text-align:left;border-bottom:1px solid #2a3a7a;padding:6px">Status</th><th style="text-align:left;border-bottom:1px solid #2a3a7a;padding:6px">Actions</th></tr>';
  rows.forEach(function(r){h+='<tr onclick="showPilotDetail(\\''+r.id+'\\')" style="cursor:pointer"><td style="padding:6px;border-bottom:1px solid #1a2a5a">'+r.id+'</td><td style="padding:6px;border-bottom:1px solid #1a2a5a">'+r.mod+'</td><td style="padding:6px;border-bottom:1px solid #1a2a5a"><b>'+r.func+'</b></td><td style="padding:6px;border-bottom:1px solid #1a2a5a">'+r.entity+'</td><td style="padding:6px;border-bottom:1px solid #1a2a5a">'+r.dir+'</td><td style="padding:6px;border-bottom:1px solid #1a2a5a">'+r.freq+'</td><td style="padding:6px;border-bottom:1px solid #1a2a5a">To confirm</td><td style="padding:6px;border-bottom:1px solid #1a2a5a"><button class="ghost" onclick="event.stopPropagation();pilotEditRow(\\'"+r.id+"\\')">Edit</button> <button class="ghost" onclick="event.stopPropagation();pilotDeleteRow(\\'"+r.id+"\\')">Delete</button></td></tr>'});
  h+='</table><p class="muted">'+rows.length+' of '+PILOT.length+' functionalities shown. Click a row for full integration details.</p>';
  document.getElementById('pilotTable').innerHTML=h;
}
function showPilotDetail(id){
  const r=PILOT.find(function(x){return x.id===id}); if(!r)return;
  pilotSelected=r;
  document.getElementById('pilotDetail').innerHTML='<h4 style="margin:0">✓ Showing details for '+r.id+' — '+r.func+'</h4><p><b>Dependencies (modulewise):</b> '+(r.deps||'None listed — confirm with customer before building.')+'</p><p class="muted">Module: '+r.mod+' | Status: To confirm | Pipeline: IN01 → MFG → PROD → CC-100</p><p><b>Direction:</b> '+r.dir+'</p><p><b>Frequency:</b> '+r.freq+'</p><p><b>D365 data entity:</b> '+r.entity+' — validate in Data management &gt; Data entities + OData metadata before building.</p><p><b>Fields:</b> '+r.fields+'</p><p><b>Field mapping (source → D365):</b> '+r.map+'</p><p><b>Validation:</b> '+r.valid+'</p><p><b>Error handling:</b> '+r.err+'</p><p><b>Test plan:</b> '+r.test+'</p><p><b>Owner:</b> To assign — must be a person, not a team.</p><p class="muted">Integration Settings are entered once for the whole project. Client Secret NEVER in this file. No live D365. No direct SQL. First run in TEST-COMPANY-01 only, 3–5 rows max.</p>';
  var banner=document.getElementById('pilotClickMsg');if(banner){banner.textContent='✓ Showing integration details for '+r.id+' — '+r.func+' (scrolled to the Integration Details card just below the table).';banner.style.display='block'}
  var card=document.getElementById('pilotDetail');if(card){card.scrollIntoView({behavior:'smooth',block:'start'})}
  fillPilotEdit();
}

function xlsxU16b(bytes,o){ return bytes[o]|(bytes[o+1]<<8); }
function xlsxU32b(bytes,o){ return (bytes[o]|(bytes[o+1]<<8)|(bytes[o+2]<<16)|(bytes[o+3]<<24))>>>0; }
function xlsxReadZip(buf){ var bytes=new Uint8Array(buf); var eocd=-1; for(var i=bytes.length-22;i>=0;i--){ if(xlsxU32b(bytes,i)===0x06054b50){ eocd=i; break; } } if(eocd<0) return null; var total=xlsxU16b(bytes,eocd+10); var cdOff=xlsxU32b(bytes,eocd+16); var files={}; var off=cdOff; for(var n=0;n<total;n++){ if(xlsxU32b(bytes,off)!==0x02014b50) break; var method=xlsxU16b(bytes,off+10); var csize=xlsxU32b(bytes,off+20); var nlen=xlsxU16b(bytes,off+28); var elen=xlsxU16b(bytes,off+30); var clen=xlsxU16b(bytes,off+32); var lhOff=xlsxU32b(bytes,off+42); var name=''; for(var k=0;k<nlen;k++) name+=String.fromCharCode(bytes[off+46+k]); var lnlen=xlsxU16b(bytes,lhOff+26); var lelen=xlsxU16b(bytes,lhOff+28); var dataStart=lhOff+30+lnlen+lelen; files[name]={method:method,comp:bytes.slice(dataStart,dataStart+csize)}; off+=46+nlen+elen+clen; } return files; }

function xlsxColIdx(ref){ var m=/^([A-Z]+)/.exec(ref||''); var s=m?m[1]:'A'; var n=0; for(var i=0;i<s.length;i++) n=n*26+(s.charCodeAt(i)-64); return n-1; }

async function uploadPilotXLSX(){ var f=document.getElementById('pilotFile').files[0]; var msg=document.getElementById('pilotMsg'); function say(s){ if(msg) msg.textContent=s; } if(!f){ say('Choose a CSV or Excel (.xlsx) file first.'); return; } try{ if(typeof DecompressionStream==='undefined'){ say('This browser cannot read .xlsx directly — please Save As .csv in Excel, then upload that .csv file.'); return; } var buf=await f.arrayBuffer(); var files=xlsxReadZip(buf); if(!files||!files['xl/worksheets/sheet1.xml']){ say('Could not read this .xlsx file — check it is a normal Excel workbook, or Save As .csv and upload that.'); return; } var shared=[]; if(files['xl/sharedStrings.xml']){ var ssBytes=await xlsxInflate(files['xl/sharedStrings.xml']); shared=xlsxSharedStrings(new TextDecoder().decode(ssBytes)); } var shBytes=await xlsxInflate(files['xl/worksheets/sheet1.xml']); var rows=xlsxSheetRows(new TextDecoder().decode(shBytes), shared); rows=rows.filter(function(x){ return x.join('').trim()!==''; }); if(!rows.length){ say('Excel file is empty.'); return; } var head=rows[0].map(function(h){ return (h||'').trim().toLowerCase(); }); if(head[0]!=='id'){ say('First row must be the header: '+pilotCSVHeader()); return; } var added=0, replaced=0; rows.slice(1).forEach(function(col){ if(col.length<3) return; var nr={id:(col[0]||'').trim(),mod:(col[1]||'').trim(),func:(col[2]||'').trim(),entity:(col[3]||'').trim(),dir:(col[4]||'').trim(),freq:(col[5]||'').trim(),fields:(col[6]||'').trim(),map:(col[7]||'').trim(),valid:(col[8]||'').trim(),err:(col[9]||'').trim(),test:(col[10]||'').trim(),deps:(col[11]||'').trim()}; if(!nr.id||!nr.mod||!nr.func) return; var ex=PILOT.findIndex(function(x){ return x.id===nr.id; }); if(ex>=0){ PILOT[ex]=nr; replaced++; } else { PILOT.push(nr); added++; } }); say('Imported from Excel: '+added+' new row(s), '+replaced+' replaced row(s). Pick Module + Functionality above to see them.'); fillPilotFuncs(); }catch(err){ say('Could not read this .xlsx file — Save As .csv in Excel and upload that .csv file.'); } }

function xlsxCRC32(bytes){let c=0xFFFFFFFF;for(let i=0;i<bytes.length;i++){c=c^bytes[i];for(let k=0;k<8;k++){c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1)}}return (c^0xFFFFFFFF)>>>0}

function xlsxBuildZip(files){let local=[],central=[],offset=0;files.forEach(function(f){const data=xlsxBytes(f.content);const name=xlsxBytes(f.name);const crc=xlsxCRC32(data);const lh=[0x50,0x4B,0x03,0x04].concat(xlsxU16(20),xlsxU16(0),xlsxU16(0),xlsxU16(0),xlsxU16(0),xlsxU32(crc),xlsxU32(data.length),xlsxU32(data.length),xlsxU16(name.length),xlsxU16(0)).concat(name,data);local=local.concat(lh);const ch=[0x50,0x4B,0x01,0x02].concat(xlsxU16(20),xlsxU16(20),xlsxU16(0),xlsxU16(0),xlsxU16(0),xlsxU16(0),xlsxU32(crc),xlsxU32(data.length),xlsxU32(data.length),xlsxU16(name.length),xlsxU16(0),xlsxU16(0),xlsxU16(0),xlsxU16(0),xlsxU32(0),xlsxU32(offset)).concat(name);central=central.concat(ch);offset+=lh.length});const cdStart=offset;const cd=central;const end=[0x50,0x4B,0x05,0x06].concat(xlsxU16(0),xlsxU16(0),xlsxU16(files.length),xlsxU16(files.length),xlsxU32(cd.length),xlsxU32(cdStart),xlsxU16(0));return new Blob([new Uint8Array(local.concat(cd,end))],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}

var hdr=parse(lines[0]);var s=MES_sheet();var rows=[];for(var i=1;i<lines.length;i++){var vals=parse(lines[i]);while(vals.length<s.cols.length)vals.push("");rows.push(vals.slice(0,s.cols.length));}
